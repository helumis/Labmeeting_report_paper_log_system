<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Meeting System</title>
    <link rel="stylesheet" href="/css/luxury_system.css"> 
</head>
<body>
    <nav>
        <form action="/search" method="get" style="display: inline-flex; align-items: center; margin-left: 20px;">
    <input type="text" name="q" placeholder="搜尋論文、作者、Tag..." required 
           style="padding: 5px; border-radius: 4px; border: 1px solid #ccc;">
    <button type="submit" class="primary-button" style="padding: 5px 10px; margin-left: 5px;">Search</button>
</form>
        <a href="/">🏠 Home</a>
        {% if current_user %}
            <a href="/upload">➕ New Report</a>
            <a href="/profile/{{ current_user.username }}">👤 Account Profile ({{ current_user.display_name }})</a>
            <a href="/logout">🚪 Logout</a>
        {% else %}
            <a href="/login">🔑 Login</a>
            <a href="/register">📝 Register</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
