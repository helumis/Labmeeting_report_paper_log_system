<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Meeting System</title>
    <link rel="stylesheet" href="/css/luxury_system.css"> 
</head>
<body>
    <nav>
        <a href="/">🏠 Home</a>
        {% if current_user %}
            <a href="/upload">➕ New Report</a>
            <a href="/profile/{{ current_user.username }}">👤 Account Profile ({{ current_user.display_name }})</a>
            <a href="/logout">🚪 Logout</a>
        {% else %}
            <a href="/login">🔑 Login</a>
            <a href="/register">📝 Register</a>
        {% endif %}
    </nav>
    <hr>
    {% block content %}{% endblock %}
</body>
</html>
