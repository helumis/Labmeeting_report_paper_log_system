{% extends "_base.html" %}
{% block content %}
<h1>Upload New Report</h1>
<form action="/upload" method="post" class="main-form">
    <h3>Report Info</h3>
    <label class="full-width-label">Title: <input type="text" name="report_title" required></label><br><br>
    <label class="full-width-label">Summary:<br><textarea name="report_summary" rows="3"></textarea></label><br><br>
    <label class="full-width-label">Slides Link: <input type="url" name="slides_link"></label><br>

    <h3>Meeting</h3>
    <select name="existing_meeting_id" class="select-option">
        <option value="">-- Create New Meeting --</option>
        {% for m in meetings %}
        <option value="{{ m.id }}">{{ m.meeting_title }} ({{ m.meeting_date }})</option>
        {% endfor %}
    </select>
    <div class="option-toggle-block"> <p>Or Create New:</p>
        <input type="text" name="meeting_title" placeholder="Meeting Title">
        <input type="date" name="meeting_date">
        <input type="text" name="meeting_location" placeholder="Location">
    </div>

    <h3>Paper</h3>
    <select name="existing_paper_id" class="select-option">
        <option value="">-- Create New Paper --</option>
        {% for p in papers %}
        <option value="{{ p.id }}">{{ p.paper_title }}</option>
        {% endfor %}
    </select>
    <div class="option-toggle-block"> <p>Or Create New Paper:</p>
        <label class="full-width-label"><input type="text" name="paper_title" placeholder="Paper Title"></label><br><br>
        
        <div class="form-row-inline">
            Year: <input type="number" name="published_year" class="input-year" placeholder="Year">
            Month: <input type="number" name="published_month" class="input-month" placeholder="Month">
        </div>
        <br><br>

        <label class="full-width-label">Venue: <input type="text" name="journal_or_conference"></label><br><br>
        <label class="full-width-label">Tags: <input type="text" name="tags" placeholder="tag1, tag2"></label><br><br>
        
        <strong>Authors:</strong><br>
        <div id="authors_container">
            <div class="author-row">
                1. <input type="text" name="author_name_0" placeholder="Name">
                <input type="text" name="author_affiliations_0" placeholder="Affiliations (comma sep)">
            </div>
        </div>
        <button type="button" onclick="addAuthor()" class="secondary-button">+ Add Author</button>
    </div>
    <br><br>
    <button type="submit" class="primary-button-large">Submit Report</button>
</form>

<script>
    function addAuthor() {
        const container = document.getElementById('authors_container');
        // 获取当前容器内的作者行数，这直接作为新作者的索引 (0, 1, 2...)
        const currentIndex = container.children.length; 
        
        const div = document.createElement('div');
        div.className = 'author-row';

        // 使用 currentIndex + 1 作为显示给用户的序号 (1., 2., 3...)
        div.innerHTML = `
            ${currentIndex + 1}. 
            <input type="text" name="author_name_${currentIndex}" placeholder="Name"> 
            <input type="text" name="author_affiliations_${currentIndex}" placeholder="Affiliations (comma sep)">
        `;
        
        container.appendChild(div);
    }
</script>
{% endblock %}
