{% extends "_base.html" %}
{% block content %}
<h1>Upload New Report</h1>
<form action="/upload" method="post">
    <h3>Report Info</h3>
    <label>Title: <input type="text" name="report_title" required style="width: 100%;"></label><br><br>
    <label>Summary:<br><textarea name="report_summary" rows="3" style="width: 100%;"></textarea></label><br><br>
    <label>Slides Link: <input type="url" name="slides_link" style="width: 100%;"></label><br>

    <h3>Meeting</h3>
    <select name="existing_meeting_id">
        <option value="">-- Create New Meeting --</option>
        {% for m in meetings %}
        <option value="{{ m.id }}">{{ m.meeting_title }} ({{ m.meeting_date }})</option>
        {% endfor %}
    </select>
    <div style="border-left: 3px solid #ccc; padding-left: 10px; margin-top: 10px;">
        <p>Or Create New:</p>
        <input type="text" name="meeting_title" placeholder="Meeting Title">
        <input type="date" name="meeting_date">
        <input type="text" name="meeting_location" placeholder="Location">
    </div>

    <h3>Paper</h3>
    <select name="existing_paper_id">
        <option value="">-- Create New Paper --</option>
        {% for p in papers %}
        <option value="{{ p.id }}">{{ p.paper_title }}</option>
        {% endfor %}
    </select>
    <div style="border-left: 3px solid #ccc; padding-left: 10px; margin-top: 10px;">
        <p>Or Create New Paper:</p>
        <input type="text" name="paper_title" placeholder="Paper Title" style="width: 100%;"><br><br>
        Year: <input type="number" name="published_year" style="width: 60px;"> 
        Month: <input type="number" name="published_month" style="width: 40px;"><br><br>
        Venue: <input type="text" name="journal_or_conference"><br><br>
        Tags: <input type="text" name="tags" placeholder="tag1, tag2"><br><br>
        
        <strong>Authors:</strong><br>
        <div id="authors_container">
            <div>
                1. <input type="text" name="author_name_0" placeholder="Name">
                <input type="text" name="author_affiliations_0" placeholder="Affiliations (comma sep)">
            </div>
        </div>
        <button type="button" onclick="addAuthor()">+ Add Author</button>
    </div>
    <br><br>
    <button type="submit" style="padding: 10px 20px;">Submit Report</button>
</form>

<script>
let authCount = 1;
function addAuthor() {
    const div = document.createElement('div');
    div.innerHTML = `${authCount+1}. <input type="text" name="author_name_${authCount}" placeholder="Name"> <input type="text" name="author_affiliations_${authCount}" placeholder="Affiliations">`;
    document.getElementById('authors_container').appendChild(div);
    authCount++;
}
</script>
{% endblock %}
